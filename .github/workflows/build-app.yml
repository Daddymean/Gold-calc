name: Build app

# Produces an installable build through EAS. Manual only: the free Expo plan
# includes 15 Android and 15 iOS builds a month, and a build-on-every-push
# workflow would burn through that without anyone asking for it.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: demo
        type: choice
        options: [demo, preview, production]
      platform:
        description: 'Platform'
        required: true
        default: android
        type: choice
        options: [android, ios, all]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait
